name: Update ATP Rankings Data

# Regenerates rankings.json from the local tennisdata.app season CSVs in the
# repo. Does not fetch or modify those CSVs — refresh them separately (e.g.
# scripts/refresh_data.sh) when new downloads are available.
on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data pipeline
        run: python scripts/process_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/atp/rankings.json
          git diff --staged --quiet || git commit -m "chore: update rankings data $(date -u +%Y-%m-%d)"
          git push
