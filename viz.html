<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATP Points — Visualize</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="viz.css?v=2" />
</head>
<body>
  <header>
    <h1>ATP Points — Visualize</h1>
    <p id="meta"></p>
    <nav class="page-nav">
      <a href="index.html">Table</a>
      <a href="viz.html" class="active">Visualize</a>
    </nav>
  </header>

  <div id="loading">Loading data…</div>
  <div id="error" hidden></div>

  <div id="viz-shell" hidden>
    <div class="tab-bar">
      <button class="tab active" data-tab="stacked">Stacked Bar</button>
      <button class="tab" data-tab="sankey">Sankey</button>
      <button class="tab" data-tab="bump">Bump Chart</button>
      <button class="tab" data-tab="heatmap">Heatmap</button>
    </div>

    <!-- Stacked Bar -->
    <div id="tab-stacked" class="tab-panel">
      <div class="viz-controls">
        <label>Top <select id="stacked-n"><option>10</option><option selected>20</option><option>30</option><option>50</option></select> players</label>
        <div class="chip-group" id="stacked-mode">
          <button class="chip active" data-val="level">By Level</button>
          <button class="chip" data-val="surface">By Surface</button>
        </div>
        <label class="chip-label">Surface:</label>
        <div class="chip-group" id="stacked-surface">
          <button class="chip active" data-val="Hard">Hard</button>
          <button class="chip active" data-val="Clay">Clay</button>
          <button class="chip active" data-val="Grass">Grass</button>
        </div>
        <label class="chip-label">Level:</label>
        <div class="chip-group" id="stacked-level">
          <button class="chip active" data-val="G">GS</button>
          <button class="chip active" data-val="M">Masters</button>
          <button class="chip active" data-val="500">500</button>
          <button class="chip active" data-val="250">250</button>
          <button class="chip active" data-val="F">Finals</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="stacked-legend" class="stacked-legend"></div>
        <div style="position:relative;height:480px">
          <canvas id="stacked-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Sankey -->
    <div id="tab-sankey" class="tab-panel" hidden>
      <div class="viz-controls" style="align-items:center;">
        <label>Player:</label>
        <div class="player-picker-wrap">
          <input id="sankey-search" type="text" placeholder="Search player…" autocomplete="off" class="picker-search" />
          <div id="sankey-list" class="player-picker-list"></div>
        </div>
        <span id="sankey-player-name" class="selected-player-label"></span>
      </div>
      <div class="chart-wrap" id="sankey-wrap"></div>
    </div>

    <!-- Bump Chart -->
    <div id="tab-bump" class="tab-panel" hidden>
      <div class="viz-controls" style="align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="player-picker-wrap">
          <input id="bump-search" type="text" placeholder="Add players…" autocomplete="off" class="picker-search" />
          <div id="bump-list" class="player-picker-list"></div>
        </div>
        <div id="bump-player-tags" class="player-tags-inline"></div>
        <button id="bump-clear" class="chip">Clear</button>
      </div>
      <div class="chart-wrap" id="bump-wrap"></div>
    </div>

    <!-- Heatmap (last) -->
    <div id="tab-heatmap" class="tab-panel" hidden>
      <div class="viz-controls">
        <label>Top <select id="heatmap-n"><option>20</option><option selected>30</option><option>50</option></select> players</label>
      </div>
      <div id="heatmap-legend" class="heatmap-legend"></div>
      <div class="chart-wrap" id="heatmap-wrap"></div>
    </div>
  </div>

  <div id="viz-tooltip" class="viz-tooltip" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <script src="viz.js"></script>
</body>
</html>
